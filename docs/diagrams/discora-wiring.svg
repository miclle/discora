<text x="624" y="1652" font-size="24" fill="#2d3142" font-weight="400" text-anchor="start">BCK</text>
<text x="64" y="1708" font-size="24" fill="#2d3142" font-weight="400" text-anchor="start">GPIO5</text>
<path d="M288 1700 H584" fill="none" stroke="#4f5d75" stroke-width="3"/>
<text x="624" y="1708" font-size="24" fill="#2d3142" font-weight="400" text-anchor="start">LCK / LRCK</text>
<text x="64" y="1764" font-size="24" fill="#2d3142" font-weight="400" text-anchor="start">GPIO6</text>
<path d="M288 1756 H584" fill="none" stroke="#4f5d75" stroke-width="3"/>
<text x="624" y="1764" font-size="24" fill="#2d3142" font-weight="400" text-anchor="start">DIN</text>
<text x="64" y="1820" font-size="24" fill="#2d3142" font-weight="400" text-anchor="start">GND</text>
<path d="M288 1812 H584" fill="none" stroke="#4f5d75" stroke-width="3"/>
<text x="624" y="1820" font-size="24" fill="#2d3142" font-weight="400" text-anchor="start">GND</text>
<text x="64" y="1876" font-size="24" fill="#2d3142" font-weight="400" text-anchor="start">GND</text>
<path d="M288 1868 H584" fill="none" stroke="#4f5d75" stroke-width="3"/>
<text x="624" y="1876" font-size="24" fill="#2d3142" font-weight="400" text-anchor="start">SCK</text>
<text x="64" y="1932" font-size="24" fill="#2d3142" font-weight="400" text-anchor="start">5V（确认后）</text>
<path d="M288 1924 H584" fill="none" stroke="#4f5d75" stroke-width="3" stroke-dasharray="8 6"/>
<text x="624" y="1932" font-size="24" fill="#2d3142" font-weight="400" text-anchor="start">VIN</text>
<text x="64" y="1996" font-size="20" fill="#4f5d75" font-weight="400" text-anchor="start">三线 I²S · 44.1 kHz / 16-bit stereo</text>
<text x="64" y="2032" font-size="20" fill="#4f5d75" font-weight="400" text-anchor="start">目标 BCK 1.4112 MHz；实际时钟、声音尚未验收</text>
